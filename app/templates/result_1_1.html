<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resultaten - Big Five</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 Resultaten - Big Five</h1>
            <a href="/" class="btn-back">← Home</a>
        </div>
        <div class="results-card">
            {% for key, data in results.items() %}
            <div class="result-item">
                <div class="label">
                    <span>{{ data.label }}</span>
                    <span>{{ data.score }}/50 - {{ data.level }}</span>
                </div>
                <div class="bar">
                    <div class="fill" style="width: {{ data.percentage }}%; background: {{ data.color }};"></div>
                </div>
            </div>
            {% endfor %}
            <div class="btn-group">
                <a href="{{ next_url }}" class="btn-primary">📋 Ga naar Fase 2.0</a>
                <a href="{{ retry_url }}" class="btn-back">↻ Opnieuw</a>
            </div>
        </div>
    </div>
</body>
</html>
