<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loopbaan Onderzoek</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f7fa;
            color: #333;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            max-width: 600px;
            padding: 40px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            text-align: center;
        }
        h1 {
            font-size: 36px;
            color: #1a1a2e;
            margin-bottom: 10px;
        }
        .subtitle {
            color: #666;
            font-size: 18px;
            margin-bottom: 30px;
        }
        .btn-primary {
            display: inline-block;
            background: #4a6cf7;
            color: white;
            padding: 12px 30px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            margin: 10px;
            transition: background 0.3s;
        }
        .btn-primary:hover {
            background: #3a56d4;
        }
        .btn-secondary {
            display: inline-block;
            background: #e8eaed;
            color: #333;
            padding: 12px 30px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            margin: 10px;
            transition: background 0.3s;
        }
        .btn-secondary:hover {
            background: #d5d8dd;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 Loopbaan Onderzoek</h1>
        <p class="subtitle">Welkom bij het loopbaanonderzoek platform</p>

        <div>
            <a href="/clients/" class="btn-primary">👥 Klantenbeheer</a>
        </div>
    </div>
</body>
</html>
